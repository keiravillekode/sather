name: Config

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    name: Config rules
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Rules this track adds on top of configlet's own checks:
      #
      #   * one concept per concept exercise
      #   * concepts/<slug>/introduction.md byte-identical to the matching
      #     exercises/concept/<slug>/.docs/introduction.md
      #   * the concepts array in the same order as the exercises that teach
      #     them
      #   * no exercise placed before an exercise teaching one of its
      #     prerequisites
      #   * practice exercises listed by ascending difficulty then by name,
      #     compared case-insensitively.
      #
      - name: Check config.json rules
        run: bin/check-syllabus
